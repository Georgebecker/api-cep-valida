services:
  api:
    build: .
    image: api-cep-valida:latest
    ports:
      - "8000:8000"
    environment:
      VIA_CEP_TIMEOUT: "3"
      VIA_CEP_CACHE_TTL: "300"
      RATE_LIMIT_ENABLED: "1"
      RATE_LIMIT_REQUESTS: "60"
      RATE_LIMIT_WINDOW: "60"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

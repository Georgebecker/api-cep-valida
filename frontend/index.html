<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CEP Valida — validação de documentos brasileiros</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="hero">
        <p class="tag">API REST + frontend de teste</p>
        <h1>CEP Valida</h1>
        <p class="subtitle">
          Valide CPF, CNPJ, CEP e UF com os algoritmos oficiais. Nenhum dado é armazenado.
        </p>
      </header>

      <section class="card" aria-labelledby="form-title">
        <h2 id="form-title">Validar documento</h2>
        <form id="validate-form">
          <label for="document-type">Tipo de documento</label>
          <select id="document-type" name="document-type">
            <option value="cpf">CPF</option>
            <option value="cnpj">CNPJ</option>
            <option value="cep">CEP</option>
            <option value="uf">UF</option>
            <option value="pis">PIS/PASEP</option>
          </select>

          <label for="document-value">Valor</label>
          <input
            id="document-value"
            name="document-value"
            type="text"
            autocomplete="off"
            placeholder="529.982.247-25"
            maxlength="32"
            required
          />

          <button type="submit">Validar</button>
        </form>

        <output id="result" class="result" aria-live="polite" hidden></output>
      </section>

      <section class="card examples" aria-labelledby="examples-title">
        <h2 id="examples-title">Exemplos</h2>
        <ul id="example-list"></ul>
        <p class="hint">
          Os exemplos são preenchidos no formulário ao clicar. Dados de teste não são reais.
        </p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
